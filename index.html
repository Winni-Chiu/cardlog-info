    <h1>CardLog 財匣</h1>
    <p>CardLog 是個人記帳與信用卡消費管理 App，可整理消費明細、信用卡和每月支出。</p>
    <p>財務資料預設保存在使用者的裝置。使用者可自行選擇啟用 Google Drive 備份；啟用後，App 會將備份檔存入使用者自己的 Google Drive。</p>
    <p>CardLog 不會把記帳資料上傳到 CardLog 的伺服器。</p>
    <p><a href="./privacy.html">隱私權政策</a></p>
